  if (Object.keys(remap).length) { S.folders = S.folders.filter(f => !remap[f.id]); S.recipes.forEach(r => r.folders = [...new Set((r.folders || []).map(id => remap[id] || id))]); }
  const rs = remote.stamps || {};
  for (const k of ['shop', 'plan']) if ((rs[k] || 0) > (S.stamps[k] || 0) && remote[k]) { S[k] = remote[k]; S.stamps[k] = rs[k]; }
  if ((rs.settings || 0) > (S.stamps.settings || 0) && remote.settings) { S.settings = { ...S.settings, ...remote.settings, gemKey: S.settings.gemKey }; S.stamps.settings = rs.settings; }

  const fids = new Set(S.folders.map(f => f.id)); S.recipes.forEach(r => r.folders = (r.folders || []).filter(id => fids.has(id)));
}
async function syncNow(manual) {
  if (sync.busy) { scheduleSync(1500); return; }
  if (!S.meta.syncId) S.meta.syncId = newSyncId();
  sync.busy = true; setSync('busy');
  try {
    const url = `${PROXY}/sync?id=${encodeURIComponent(S.meta.syncId)}`;
    const res = await fetch(url, { cache: 'no-store' }); if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json();
    const before = JSON.stringify([S.recipes.length, S.folders.length]);
    mergeState(remote);
    const body = JSON.stringify({ v: 1, recipes: S.recipes, folders: S.folders, shop: S.shop, plan: S.plan, settings: syncSettings(), stamps: S.stamps, deleted: S.deleted, at: Date.now() });
    const put = await fetch(url, { method: 'PUT', body, headers: { 'Content-Type': 'application/json' } });
    if (!put.ok) throw new Error('HTTP ' + put.status + ' ' + (await put.text()).slice(0, 80));
    S.meta.lastSync = Date.now(); save(true); setSync('ok');
    if (JSON.stringify([S.recipes.length, S.folders.length]) !== before || manual) render();
    if (manual) toast('☁️ Збережено в хмарі');
  } catch (e) { sync.msg = e.message; setSync('err'); if (manual) toast('⚠️ Немає звʼязку з хмарою — дані збережено на телефоні'); }
  finally { sync.busy = false; }
}

async function restoreBackup(day) {
  try {
    const b = await (await fetch(`${PROXY}/backup?id=${encodeURIComponent(S.meta.syncId)}&day=${day}`, { cache: 'no-store' })).json();

const W = '[а-щьюяіїєґa-z]*';
const UNIT_RE = '(кг|кілограм' + W + '|г|гр|грам' + W + '|мл|л|літр' + W + '|шт\\.?|штук' + W + '|ст\\.?\\s?л\\.?|столов' + W + '\\s+лож' + W + '|ч\\.?\\s?л\\.?|чайн' + W + '\\s+лож' + W + '|склянк' + W + '|чашк' + W + '|зубч' + W + '|пуч' + W + '|дрібк' + W + '|щіпк' + W + '|упак' + W + '|банк' + W + '|g|kg|ml|l|tbsp|tsp|cups?|pcs)';
const NUM_RE = '(\\d+(?:[.,]\\d+)?(?:\\s*\\/\\s*\\d+)?|[½¼¾⅓⅔]|\\d+\\s*[½¼¾])';
function normUnit(u) {
  if (!u) return '';
  u = u.toLowerCase().replace(/\s+/g, ' ').trim();
  if (/^(кг|кілограм|kg)/.test(u)) return 'кг';
  if (/^(г|гр|грам|g)$/.test(u) || /^грам/.test(u)) return 'г';
  if (/^(мл|ml)/.test(u)) return 'мл';
  if (/^(л|літр|l)$/.test(u) || /^літр/.test(u)) return 'л';
  if (/^(шт|штук|pcs)/.test(u)) return 'шт';
  if (/^(ст\.?\s?л|столов|tbsp)/.test(u)) return 'ст.л.';
  if (/^(ч\.?\s?л|чайн|tsp)/.test(u)) return 'ч.л.';
  if (/^(склянк|чашк|cup)/.test(u)) return 'склянка';
  if (/^зубч/.test(u)) return 'зубчик';
  if (/^пуч/.test(u)) return 'пучок';
  if (/^(дрібк|щіпк)/.test(u)) return 'дрібка';
  if (/^упак/.test(u)) return 'упак.';
  if (/^банк/.test(u)) return 'банка';
  return u;
}
function parseNum(s) {
  if (!s) return null;
  s = s.replace(',', '.').trim();
  const frac = {'½': .5, '¼': .25, '¾': .75, '⅓': 1/3, '⅔': 2/3};
  let m = s.match(/^(\d+)\s*([½¼¾])$/); if (m) return +m[1] + frac[m[2]];
  if (frac[s]) return frac[s];
  m = s.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return +m[1] / +m[2];
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function parseIngredient(line) {
  let s = line.replace(/^[\s•\-–—*·▪️✔️☑️]+/, '').replace(/\s+/g, ' ').trim();
  let m = s.match(new RegExp('^' + NUM_RE + '\\s*(?:' + UNIT_RE + '(?=[\\s.]|$)\\.?)?\\s*(.+)$', 'i'));
  if (m && m[3]) return { name: cleanName(m[3]), amount: parseNum(m[1]), unit: normUnit(m[2]) || (parseNum(m[1]) != null ? 'шт' : '') };
  m = s.match(new RegExp('^(.+?)[\\s:—–-]+' + NUM_RE + '\\s*(?:' + UNIT_RE + ')?\\.?$', 'i'));
  if (m) return { name: cleanName(m[1]), amount: parseNum(m[2]), unit: normUnit(m[3]) || 'шт' };
  return { name: cleanName(s), amount: null, unit: '' };
}
const cleanName = n => n.replace(/[\s,:—–-]+$/, '').replace(/^[\s,:—–-]+/, '').trim();
function fmtNum(n) {
  if (n == null) return '';
  if (n >= 100) return String(Math.round(n / 5) * 5);
  if (n >= 10) return String(Math.round(n));
  const r = Math.round(n * 10) / 10;
  const fr = {0.5: '½', 0.3: '⅓', 0.7: '⅔', 0.2: '¼', 0.8: '¾'};
  const whole = Math.floor(r), part = Math.round((r - whole) * 10) / 10;
  if (part && fr[part] && Math.abs(n - (whole + {0.5:.5,0.3:1/3,0.7:2/3,0.2:.25,0.8:.75}[part])) < 0.06) return (whole ? whole : '') + fr[part];
  return String(r).replace('.', ',');
}
const ingLine = i => [i.amount != null ? fmtNum(i.amount) : '', i.amount != null || i.unit ? i.unit : '', i.name].filter(Boolean).join(' ');

const UNIT_G = { 'г': 1, 'кг': 1000, 'мл': 1, 'л': 1000, 'ст.л.': 15, 'ч.л.': 5, 'склянка': 200, 'зубчик': 5, 'пучок': 30, 'дрібка': 0.5 };
function foodOf(name) { const n = name.toLowerCase(); const f = FOOD.find(([k]) => n.includes(k)); return f ? f[1] : null; }
function gramsOf(ing, food) {
  if (ing.amount == null) return 0;
  if (UNIT_G[ing.unit] != null) return ing.amount * UNIT_G[ing.unit];
  if (ing.unit === 'шт' || !ing.unit) return ing.amount * (food && food[4] ? food[4] : 100);
  return null;
}
function nutrition(r) {
  if (r.macros && r.macros.kcal) return { ...r.macros, manual: true };
  let k = 0, p = 0, f = 0, c = 0, hit = 0, total = 0;
  for (const i of r.ingredients) {
    if (i.amount == null) continue;
    total++;
    const food = foodOf(i.name); if (!food) continue;
    const g = gramsOf(i, food); if (g == null) continue;
    hit++; k += food[0] * g / 100; p += food[1] * g / 100; f += food[2] * g / 100; c += food[3] * g / 100;
  }
  const s = Math.max(1, r.servings || 1);
  return { kcal: Math.round(k / s), p: Math.round(p / s), f: Math.round(f / s), c: Math.round(c / s), hit, total };
}
function dailyTarget() {
  const s = S.settings;
  if (!s.weight || !s.height || !s.age) return null;
  const bmr = 10 * s.weight + 6.25 * s.height - 5 * s.age + (s.sex === 'm' ? 5 : -161);
  return Math.round(bmr * (+s.activity || 1.375) * (1 + (+s.goal || 0)));
}

  ['🥤 Напої', /вод[аиу](?=\s)|мінерал|газован|сік|соку(?=\s)|компот|морс|лимонад|кола|пиво|вино|коньяк|ром(?=\s)|горілк|лікер|віскі|просек|шампан|кава|чай|енергет|тонік/],
];
// Порядок показу — як обхід магазину: овочі → мʼясо/риба → молочне → хліб → бакалія → заморожене → напої
const SHOP_ORDER = ['🥬 Овочі та зелень', '🍎 Фрукти та ягоди', '🥜 Горіхи та сухофрукти', '🥩 Мʼясо та птиця', '🐟 Риба та морепродукти', '🥓 Ковбаси та копченості', '🥛 Молочне', '🧀 Сири', '🥚 Яйця', '🍞 Хліб та випічка', '🌾 Крупи, борошно, макарони', '🫙 Консерви та соуси', '🫒 Олії та оцет', '🧂 Спеції та приправи', '🍫 Для випічки та солодке', '🧊 Заморожене', '🥤 Напої', '📦 Інше'];
function shopCat(name) {
  const n = ' ' + name.toLowerCase().replace(/ʼ|’/g, "'") + ' ';
  for (const [cat, re] of SHOP_CATS) if (re.test(n)) return cat;
  return '📦 Інше';
}

/* ====================== Стан інтерфейсу ====================== */
const ui = { tab: 'recipes', view: 'list', id: null, q: '', cat: 'all', mode: 'all', fq: '', serv: null, draft: null, stack: [] };
function go(tab, view = 'list', id = null, push = true) {
  if (push) ui.stack.push({ tab: ui.tab, view: ui.view, id: ui.id });
  Object.assign(ui, { tab, view, id, serv: null });
  render(); window.scrollTo(0, 0);
}
function back() { const p = ui.stack.pop(); if (p) go(p.tab, p.view, p.id, false); else go('recipes', 'list', null, false); }
const R = id => S.recipes.find(r => r.id === id);

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function sheet(html) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'ov';
  o.innerHTML = `<div class="sheet">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
}
function closeSheet() { document.getElementById('ov')?.remove(); }

/* ====================== Рендер ====================== */
function render() {

  const v = ui.tab === 'recipes' ? (ui.view === 'detail' ? vDetail() : ui.view === 'edit' ? vEdit() : ui.view === 'folder' ? vFolder() : vList())
          : ui.tab === 'plan' ? vPlan() : ui.tab === 'shop' ? vShop() : vMore();
  a.innerHTML = `<div class="wrap">${v}</div>`;
  renderTabs();

    document.getElementById('q')?.addEventListener('input', e => { ui.q = e.target.value; const g = document.getElementById('rgrid'); if (g) g.innerHTML = ui.mode === 'folders' ? folderGridHTML() : gridHTML(); });

function renderTabs() {

/* ---- Список рецептів і папки ---- */

    <div class="btns" style="margin:10px 0 0"><button class="btn sm" onclick="linkDevice()">📲 Ввести код</button><button class="btn sec sm" onclick="S.meta.hideLinkHint=true;save(true);render()">Це новий початок</button></div></div>` : ''}
  <div class="seg" style="margin:4px 0 8px"><button class="${ui.mode === 'all' ? 'on' : ''}" onclick="ui.mode='all';render()">📖 Усі рецепти</button><button class="${ui.mode === 'folders' ? 'on' : ''}" onclick="ui.mode='folders';render()">📁 Папки</button></div>

function folderGridHTML() {

  <button class="btn danger" style="margin-top:12px" onclick="delRecipe('${r.id}')">Видалити рецепт</button>`;

const porc = n => n % 10 === 1 && n % 100 !== 11 ? 'порція' : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? 'порції' : 'порцій';
function setServ(d) { const r = R(ui.id); ui.serv = Math.max(1, (ui.serv ?? r.servings) + d); render(); }

/* ---- Варіанти рецепта (копія зі зміною частини) ---- */
const rootOf = r => r.variantOf && R(r.variantOf) ? r.variantOf : r.id;

async function createVariant(id) {

  const hasGroups = !!document.getElementById('v_keep');

        + (hasGroups ? `Складові, які треба залишити БЕЗ ЗМІН (ті самі інгредієнти, кількості й кроки): ${[...keep].join(', ') || '—'}. Інші складові перероби відповідно до запиту.\n` : 'Усе, чого запит не стосується, залиш без змін.\n')

    for (const l of v('e_ing').split('\n').map(s => s.trim()).filter(Boolean)) { if (isGroupHeader(l)) { g = headerName(l); continue; } const i = parseIngredient(l); if (g) i.group = g; d.ingredients.push(i); } }
  { let g = ''; d.steps = []; d.stepGroups = [];

/* ---- Імпорт з тексту ---- */
function openImport() {

async function pasteClip() { try { document.getElementById('imp').value = await navigator.clipboard.readText(); } catch { toast('Утримуйте поле й оберіть «Вставити»'); } }
function doImport() {
  const txt = document.getElementById('imp').value.trim(); if (!txt) return;
  const r = parseRecipeText(txt); closeSheet(); syncDraft();
  const d = ui.draft;
  if (!d.title) d.title = r.title; if (r.servings) d.servings = r.servings; if (r.time) d.time = r.time; if (r.source) d.source = r.source;
  d.ingredients = r.ingredients.length ? r.ingredients : d.ingredients; if (r.steps.length) { d.steps = r.steps; d.stepGroups = r.stepGroups; }
  render(); toast(`Знайдено: ${r.ingredients.length} інгр., ${r.steps.length} кроків`);
}
function parseRecipeText(txt) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^#\w/.test(l));
  let title = '', mode = null, ingredients = [], steps = [], stepGroups = [], group = '', servings = null, time = null, source = '';
  const isIngHead = l => /^(інгредієнт|склад|що потрібно|нам знадобиться|продукти|ingredients|ингредиент)/i.test(l);
  const isStepHead = l => /^(приготування|спосіб|як готувати|рецепт:|кроки|інструкц|method|directions|instructions|steps|приготовление)/i.test(l);
  for (let l of lines) {
    const url = l.match(/https?:\/\/\S+/); if (url && !source) { source = url[0]; if (l === url[0]) continue; }
    const sv = l.match(/(\d+)\s*(порц|serving|персон)/i) || l.match(/^(?:порці\S*|serves|servings)[^\d]{0,5}(\d+)/i); if (sv && l.length < 40) { servings = +sv[1]; continue; }
    const tm = l.match(/(?:час|time)[^\d]{0,15}(\d+)\s*(хв|min|год|h)/i); if (tm && l.length < 50) { time = /год|h/i.test(tm[2]) ? tm[1] * 60 : +tm[1]; continue; }
    if (isIngHead(l)) { mode = 'ing'; const rest = l.replace(/^[^:]*:\s*/, ''); if (rest && rest !== l) rest.split(/[,;]/).forEach(x => x.trim() && ingredients.push(parseIngredient(x))); continue; }
    if (isStepHead(l)) { mode = 'step'; group = ''; continue; }
    if (mode && isGroupHeader(l) && !/^\d/.test(l)) { group = headerName(l); continue; }
    const clean = l.replace(/^[\p{Extended_Pictographic}️\s]+/u, '');
    if (!clean) continue;
    if (!title && !mode) { title = clean.replace(/[:.!]+$/, '').slice(0, 80); continue; }
    const numbered = /^\d+[.)]\s+/.test(clean);
    const looksIng = new RegExp('^' + NUM_RE + '\\s*' + UNIT_RE + '?\\s', 'i').test(clean) || /^[-•*·]/.test(l) || /за смаком|to taste/i.test(clean);
    if (mode === 'step' || (numbered && clean.length > 25)) { steps.push(clean.replace(/^\d+[.)]\s+/, '')); stepGroups.push(group); }
    else if (mode === 'ing' || (looksIng && clean.length < 60)) { const i = parseIngredient(clean); if (group) i.group = group; ingredients.push(i); }
    else if (clean.length > 25) { steps.push(clean); stepGroups.push(group); }
  }
  return { title: title || 'Новий рецепт', ingredients, steps, stepGroups: stepGroups.some(Boolean) ? stepGroups : undefined, servings, time, source };
}

/* ---- Складові страви (тісто, соус, начинка…) ---- */
const GROUP_EMOJI = [[/тіст|корж|основ/i,'🫓'],[/соус|заправ|маринад|глазур/i,'🥫'],[/начин|топінг/i,'🧀'],[/крем|мус/i,'🍦'],[/подач|прикрас|декор/i,'🌿'],[/бульйон/i,'🍲'],[/фарш|мʼяс|м'яс/i,'🥩'],[/збир|випік|запік|смаж|подач/i,'🔥']];
const groupEmoji = g => (GROUP_EMOJI.find(([re]) => re.test(g)) || [0, '▸'])[1];
// розбиваємо масив на блоки [{group, items:[{x, i}]}] зі збереженням порядку
function grouped(arr, groupOf) {
  const out = [];
  arr.forEach((x, i) => { const g = (groupOf(x, i) || '').trim(); const last = out[out.length - 1]; if (last && last.group === g) last.items.push({ x, i }); else out.push({ group: g, items: [{ x, i }] }); });
  return out;
}
const stepGroupOf = (r, i) => (r.stepGroups || [])[i] || '';
const hasGroups = r => r.ingredients.some(i => i.group) || (r.stepGroups || []).some(Boolean);
const isGroupHeader = l => /^#\s*\S/.test(l) || (/^[^\d]{2,40}:\s*$/.test(l) && !/за смаком/i.test(l));
const headerName = l => l.replace(/^#\s*/, '').replace(/:\s*$/, '').replace(/^для\s+/i, m => m).trim();
function linesWithGroups(items, text, groupOf) {
  const out = []; let g = null;
  items.forEach((x, i) => { const gg = groupOf(x, i) || ''; if (gg !== g) { if (gg) out.push('# ' + gg); g = gg; } out.push(text(x)); });
  return out.join('\n');
}

/* ---- Грамовки в кроках ---- */
const IRREG = { 'сіль': ['сіль', 'солі', 'сіллю'], 'яйце': ['яйц', 'яєць', 'яйце'], 'яйця': ['яйц', 'яєць', 'яйце'], 'цукор': ['цукор', 'цукр'], 'мед': ['мед'], 'рис': ['рис'], 'сир': ['сир'], 'лід': ['лід', 'льод'], 'часник': ['часник'], 'перець': ['перець', 'перц'] };
const QUANT_BEFORE = /(половин\S*|решт\S*|частин\S*|трохи|трішки|дещо|щіпк\S*|жмен\S*|залиш\S*|\d[\d.,\/]*\s*\S*)\s*$/i;
const wordRe = /[\p{L}ʼ'’-]+/gu;
function ingStems(name) {
  const n = name.toLowerCase();
  if (IRREG[n]) return IRREG[n];
  const words = n.match(wordRe) || [];
  const out = [];
  for (const w of words) { if (IRREG[w]) out.push(...IRREG[w]); else if (w.length >= 6) out.push(w.slice(0, w.length - 2)); else if (w.length >= 4) out.push(w.slice(0, w.length - 1)); }
  return out;
}
// повертає масив частин: рядки і {amount} — щоб і HTML, і простий текст будувати з одного місця
function stepParts(r, i, k) {
  const text = r.steps[i] || '', g = stepGroupOf(r, i);
  const words = [...text.matchAll(wordRe)].map(m => ({ w: m[0].toLowerCase(), start: m.index, end: m.index + m[0].length }));
  const used = new Set(), inserts = [];
  const pools = g ? [r.ingredients.filter(x => (x.group || '') === g), r.ingredients.filter(x => (x.group || '') !== g)] : [r.ingredients];
  const done = new Set();
  for (const pool of pools) for (const ing of pool) {
    if (ing.amount == null || done.has(ing.name.toLowerCase())) continue;
    const stems = ingStems(ing.name); if (!stems.length) continue;
    const hit = words.find(wd => !used.has(wd.start) && stems.some(st => wd.w.startsWith(st)));
    if (!hit) continue;
    // продукт уже згадувався в попередніх кроках цієї ж складової — кількість не повторюємо («посипте борошном поверхню»)
    const earlier = r.steps.slice(0, i).some((t, j) => (!g || stepGroupOf(r, j) === g || !(ing.group)) && (t.toLowerCase().match(wordRe) || []).some(w => stems.some(st => w.startsWith(st))));
    if (earlier) { used.add(hit.start); done.add(ing.name.toLowerCase()); continue; }
    done.add(ing.name.toLowerCase());
    // кінець назви: якщо назва з кількох слів і наступні слова теж збігаються — вставляємо після них
    let end = hit.end; const idx = words.indexOf(hit);
    for (let j = idx + 1; j < words.length && j <= idx + 2; j++) { if (stems.some(st => words[j].w.startsWith(st)) && /^\s*$/.test(text.slice(end, words[j].start))) { end = words[j].end; used.add(words[j].start); } else break; }
    used.add(hit.start);
    if (QUANT_BEFORE.test(text.slice(Math.max(0, hit.start - 14), hit.start))) continue;   // «половину молока», «200 г борошна» — не чіпаємо
    if (/^\s*\(?\s*\d/.test(text.slice(end, end + 4))) continue;                          // «борошно 200 г» — вже є
    inserts.push({ at: end, amount: `${fmtNum(ing.amount * k)} ${ing.unit}`.trim(), name: ing.name });
  }
  inserts.sort((a, b) => a.at - b.at);
  const parts = []; let pos = 0;
  for (const ins of inserts) { parts.push(text.slice(pos, ins.at)); parts.push({ amount: ins.amount, name: ins.name }); pos = ins.at; }
  // «змішайте всі інгредієнти» — перелічуємо продукти цієї складової, які ще не згадувались
  if (/(усі|всі|решту|інші)\s+(інгредієнт|продукт|компонент|складник)/i.test(text)) {
    const pool = (g ? r.ingredients.filter(x => (x.group || '') === g) : r.ingredients).filter(x => x.amount != null || x.unit);
    const mentioned = x => { const st = ingStems(x.name); return r.steps.slice(0, i).some((t, j) => (!g || stepGroupOf(r, j) === g) && (t.toLowerCase().match(wordRe) || []).some(w => st.some(s => w.startsWith(s)))) || done.has(x.name.toLowerCase()); };
    let list = pool.filter(x => !mentioned(x)); if (!list.length) list = pool;
    if (list.length && list.length <= 14) {
      const tail = text.slice(pos).replace(/[.\s]+$/, ''); parts.push(tail + ': ');
      list.forEach((x, n) => { parts.push((n ? ', ' : '') + x.name); if (x.amount != null) parts.push({ amount: `${fmtNum(x.amount * k)} ${x.unit}`.trim(), name: x.name }); });
      parts.push('.'); return parts;
    }
  }
  parts.push(text.slice(pos));
  return parts;
}
function stepIngredients(r, i, k) { return stepParts(r, i, k).filter(p => typeof p !== 'string').map(p => ({ name: p.name || '', amount: p.amount })); }
const stepHTML = (r, i, k) => stepParts(r, i, k).map(p => typeof p === 'string' ? esc(p) : ` <span class="qa">(${esc(p.amount)})</span>`).join('');
const stepPlain = (r, i, k) => stepParts(r, i, k).map(p => typeof p === 'string' ? p : ` (${p.amount})`).join('');

/* ---- Пошук дублікатів ---- */
const normTitle = t => (t || '').toLowerCase().replace(/[\p{Extended_Pictographic}️]/gu, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const STOP = new Set(['з', 'та', 'і', 'й', 'в', 'у', 'на', 'для', 'по', 'зі', 'із', 'без', 'рецепт', 'смачний', 'смачні', 'домашній', 'домашні', 'простий', 'швидкий']);

function titleSim(a, b) {
  const A = words(a), B = words(b); if (!A.size || !B.size) return 0;
  if (normTitle(a) === normTitle(b)) return 1;
  let common = 0; A.forEach(w => { if (B.has(w)) common++; });
  return common / Math.max(A.size, B.size);
}
function findSimilar(title, exceptId) {
  let best = null, bs = 0;
  for (const r of S.recipes) { if (r.id === exceptId) continue; const sc = titleSim(title, r.title); if (sc > bs) { bs = sc; best = r; } }
  return bs >= 0.67 ? best : null;
}

function findBySource(url, videoId, exceptId) {

}

async function fetchBlob(url, opt, onPct) {

  const total = +res.headers.get('Content-Length') || 0;
  if (!res.body || !total) return res.blob();
  const reader = res.body.getReader(), chunks = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; onPct && onPct(got / total, got); }

}

Правила:
- Пиши українською, навіть якщо оригінал іншою мовою.
- title: коротка зрозуміла назва страви.
- ingredients: name — назва продукту в називному відмінку з малої літери (напр. «борошно», «куряче філе»); amount — число або null; unit — одне з: г, кг, мл, л, шт, ст.л., ч.л., склянка, зубчик, пучок, дрібка, або порожній рядок. Не пропускай спецій та олії.
- Якщо кількості не названо, оціни їх за відео й напиши в notes, що кількості орієнтовні.
- steps: короткі кроки в наказовому способі («Наріжте…»), з часом і температурою, якщо вони є. У кожному кроці НАЗИВАЙ усі інгредієнти, які в ньому використовуються, тими самими словами, що й у списку (напр. «Змішайте борошно, сіль і цукор, влийте пиво»). Кількості в кроках цифрами НЕ пиши — застосунок підставить їх сам з урахуванням порцій. Якщо береться лише частина продукту, так і пиши: «половину молока», «решту борошна». НІКОЛИ не пиши «змішайте всі інгредієнти» — перелічи кожен продукт.
- СПЕРШУ визнач is_complex: true, якщо страва має окремі складові (тісто + соус + начинка, корж + крем, маринад + мʼясо + гарнір тощо). Якщо is_complex=true — group ОБОВʼЯЗКОВО непорожній у кожного інгредієнта й кроку. Якщо false — group порожній.
- СКЛАДОВІ: якщо страва складається з кількох частин (піца: Тісто, Соус, Начинка; торт: Корж, Крем, Прикраса; паста: Соус, Подача), заповни group — коротку назву складової з великої літери — для КОЖНОГО інгредієнта й кроку. Порядок груп — у логіці приготування (спершу тісто, потім соус, потім начинка і випікання). Однаковий продукт у двох складових вказуй окремо з кількістю для кожної. Кроки збирання й випікання — окрема група, напр. «Збирання та випікання». Для простих страв group — порожній рядок.

window.__gemLog = [];
async function gemAttempt(m, parts, ctl) {
  const t0 = Date.now();
  const limit = m === 'gemini-3.1-flash-lite' ? 120000 : 45000;
  const timer = setTimeout(() => ctl.abort(), limit);
  try {
    const gc = { temperature: 0.2, responseMimeType: 'application/json', responseSchema: RECIPE_SCHEMA };
    if (!S.meta.noLowRes) gc.mediaResolution = 'MEDIA_RESOLUTION_LOW';
    if (!S.meta.noThinkCfg2) gc.thinkingConfig = { thinkingLevel: m === 'gemini-3.8-flash' ? 'low' : 'minimal' };
    const abortErr = () => Object.assign(new Error(ctl.reason === 'lost' ? 'lost' : 'timeout'), { status: ctl.reason === 'lost' ? 'lost' : 'timeout' });
    let res;
    try { res = await gemFetch(`${GEM}/v1beta/models/${m}:generateContent`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: gc }) }); }
    catch (e) { if (e.name === 'AbortError') throw abortErr(); throw e; }
    const j = await res.json().catch(e => { if (e.name === 'AbortError') throw abortErr(); throw e; });
    if (j.error) {
      if (j.error.code === 400 && /media.?resolution/i.test(j.error.message || '')) { S.meta.noLowRes = true; save(true); throw Object.assign(new Error('retry'), { status: 400 }); }
      if (j.error.code === 400 && /thinking/i.test(j.error.message || '')) { S.meta.noThinkCfg2 = true; save(true); throw Object.assign(new Error('retry'), { status: 400 }); }
      throw Object.assign(new Error(j.error.message || 'Gemini error'), { status: j.error.code });
    }
    noteUse(m);
    const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    if (!txt) throw Object.assign(new Error(j.promptFeedback?.blockReason ? 'Запит заблоковано' : 'Порожня відповідь'), { status: 'empty' });
    const r = JSON.parse(txt.replace(/^```json\s*|```$/g, ''));
    window.__gemLog.push({ m, ok: true, s: (Date.now() - t0) / 1000 }); r._model = m;
    return r;
  } catch (e) {
    window.__gemLog.push({ m, status: e.status, msg: String(e.message).slice(0, 80), s: (Date.now() - t0) / 1000 });
    if (e.status === 429) noteUse(m, /per.?day|daily|PerDay/i.test(e.message));
    else if (e.status === 400 && e.message !== 'retry') noteUse(m);
    throw e;
  } finally { clearTimeout(timer); }
}
// «Перегони» моделей: запити стартують за розкладом; якщо всі запущені вже впали — наступний стартує одразу.
// Перша успішна відповідь перемагає, решта скасовуються.
function gemRace(parts, schedule) {
  return new Promise((resolve, reject) => {
    let done = false, next = 0, running = 0, lastErr; const ctls = []; const timers = [];
    const finish = (ok, val) => { if (done) return; done = true; timers.forEach(clearTimeout); ctls.forEach(c => c.abort('lost')); ok ? resolve(val) : reject(val); };
    const launch = () => {
      if (done) return;
      while (next < schedule.length && !leftToday(schedule[next][0])) next++;
      if (next >= schedule.length) { if (!running) finish(false, lastErr || Object.assign(new Error('limit'), { status: 429 })); return; }
      const [m] = schedule[next++]; running++;
      if (next > 1) aiStatus(`🔁 Gemini перевантажений — паралельно пробую ${GEM_LIMITS[m]?.name || m}…`);
      const c = new AbortController(); ctls.push(c);
      gemAttempt(m, parts, c).then(r => finish(true, r)).catch(e => {
        running--; lastErr = e;
        if (/api key|API_KEY/i.test(e.message)) return finish(false, e);
        if (e.status && ![400, 404, 429, 500, 502, 503, 504, 524, 'timeout', 'empty', 'lost'].includes(e.status)) return finish(false, e);
        if (!running) launch();   // нікого не лишилось у грі — запускаємо наступного негайно
      });
      if (next < schedule.length) { const gap = schedule[next][1] - schedule[next - 1][1]; timers.push(setTimeout(launch, Math.max(0, gap))); }
    };
    launch();
  });
}
async function gemGenerate(parts) {
  const fast = S.settings.fastMode !== false;
  // [модель, на якій секунді стартувати]
  const schedule = fast
    ? [['gemini-3.5-flash-lite', 0], ['gemini-3.5-flash-lite', 4000], ['gemini-3.1-flash-lite', 8000], ['gemini-3.6-flash', 12000], ['gemini-3.8-flash', 20000], ['gemini-3.5-flash-lite', 30000]]
    : [[S.settings.gemModel, 0], [S.settings.gemModel, 5000], ...GEM_MODELS.filter(m => m !== S.settings.gemModel).map((m, i) => [m, 10000 + i * 6000])];
  try { return await gemRace(parts, schedule); }
  catch (e) {
    if (e && [500, 502, 503, 504, 'timeout'].includes(e.status)) throw new Error('Gemini зараз перевантажений. Спробуйте через кілька хвилин.');
    throw e;
  }
}
async function videoPoster(file) {
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(file);
    let done = false; const fin = d => { if (!done) { done = true; URL.revokeObjectURL(url); res(d); } };

    v.onseeked = () => { try { const sc = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight)); const c = document.createElement('canvas'); c.width = v.videoWidth * sc; c.height = v.videoHeight * sc; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); fin(c.toDataURL('image/jpeg', 0.72)); } catch { fin(''); } };
    v.onerror = () => fin(''); setTimeout(() => fin(''), 8000);
  });
}

  return new Promise(res => { const img = new Image(), url = URL.createObjectURL(file); img.onload = () => { const sc = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * sc; c.height = img.height * sc; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); }; img.onerror = () => res(''); img.src = url; });
}

const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) {
    const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z' + b64u(new Uint8Array(await new Response(st).arrayBuffer()));
  }
  return 'p' + b64u(bytes);
}
async function unpack(s) {
  const bytes = unb64u(s.slice(1));
  if (s[0] === 'z') { const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }

}

  if (!S.recipes.length) { toast('Спершу додайте рецепти'); return; }

  const n = S.settings.mealsPerDay || 2;
  const inF = (r, re) => recipeFolders(r).some(f => re.test(f.name)) || re.test(r.category || '');
  const breakfasts = S.recipes.filter(r => inF(r, /снідан/i)), mains = S.recipes.filter(r => !inF(r, /снідан|десерт|напо/i));
  const bag = (arr) => { let pool = []; return () => { if (!pool.length) pool = [...arr].sort(() => Math.random() - .5); return pool.pop(); }; };

  const need = stepIngredients(r, cook.i, cook.k || 1).filter(x => x.amount);
  el.innerHTML = `<div class="row between"><button class="iconbtn" onclick="endCook()" aria-label="Закрити">✕</button><b style="flex:1;text-align:center;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</b><button class="iconbtn" onclick="cookIngr()" aria-label="Інгредієнти">📋</button></div>
    <div class="prog"><i style="width:${(cook.i + 1) / r.steps.length * 100}%"></i></div>
    <div class="awake" id="awake"></div>
    <div class="stepno" onclick="cookSteps()" style="cursor:pointer">${g ? `${groupEmoji(g)} ${esc(g)} · ` : ''}Крок ${cook.i + 1} з ${r.steps.length} ▾</div>
    <div class="txt">${stepHTML(r, cook.i, cook.k || 1)}
      ${need.length ? `<div class="need">${need.map(x => `<span>${esc(x.name)} <b>${esc(x.amount)}</b></span>`).join('')}</div>` : ''}
      <div class="tbtns">${stepTimes(step).map(t => `<button class="btn sec sm" onclick="addTimer(${t.sec},'${esc(t.label)}')">⏱ ${esc(t.label)}</button>`).join('')}
        <button class="btn sec sm" onclick="timerSheet()">⏱ Свій таймер</button></div></div>
    <div class="timers" id="tlist"></div>
    <div class="btns" style="margin-bottom:0"><button class="btn sec" ${cook.i ? '' : 'disabled style="opacity:.4"'} onclick="cookGo(-1)">‹ Назад</button>
      <button class="btn" onclick="${last ? 'endCook(true)' : 'cookGo(1)'}">${last ? 'Готово 🎉' : 'Далі ›'}</button></div>`;
  renderCookAwake(); tickTimers();
}
function cookSteps() {
  const r = R(cook.id);
  sheet(`<h3>Кроки</h3>${grouped(r.steps, (x, i) => stepGroupOf(r, i)).map(b => (b.group ? `<div class="grp">${groupEmoji(b.group)} ${esc(b.group)}</div>` : '') + b.items.map(({ x, i }) => `<div class="pr" style="cursor:pointer;${i === cook.i ? 'background:var(--accent-soft);border-radius:10px' : ''}" onclick="closeSheet();cook.i=${i};renderCook()"><div class="th">${i + 1}</div><div class="n small">${esc(x.slice(0, 90))}${x.length > 90 ? '…' : ''}</div></div>`).join('')).join('')}`);
  document.getElementById('ov').style.zIndex = 70;
}
function timerSheet() {
  const P = [1, 2, 3, 5, 7, 10, 12, 15, 20, 25, 30, 40, 45, 60, 90];
  sheet(`<h3>⏱ Таймер</h3><div class="chips" style="flex-wrap:wrap">${P.map(m => `<button class="chip" onclick="closeSheet();addTimer(${m * 60},'${m < 60 ? m + ' хв' : m / 60 + ' год'}')">${m < 60 ? m + ' хв' : (m / 60) + ' год'}</button>`).join('')}</div>
    <label class="f">Свій час</label><div class="addrow"><input class="inp" id="tmin" type="number" inputmode="numeric" placeholder="хвилин" min="1"><input class="inp" id="tlabel" placeholder="назва (необовʼязково)">
    <button class="btn sm" onclick="const m=+document.getElementById('tmin').value;if(m>0){closeSheet();addTimer(m*60,document.getElementById('tlabel').value||m+' хв')}">Старт</button></div>
    <div class="row between" style="margin-top:14px"><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" ${S.settings.timerVibrate !== false ? 'checked' : ''} onchange="S.settings.timerVibrate=this.checked;save()" style="width:20px;height:20px"> 📳 Вібрація</label>
      <button class="btn sec sm" onclick="testAlarm()">🔔 Перевірити сигнал</button></div>
    <label class="f">Гучність</label><input type="range" min="0.2" max="1" step="0.1" value="${S.settings.timerVolume ?? 0.8}" oninput="S.settings.timerVolume=+this.value;save()" onchange="testAlarm()" style="width:100%">
    <p class="small muted">Звук і вібрація працюють, поки Казанок відкритий на екрані. Вібрація на iPhone — з iOS 18.</p>`);
  document.getElementById('ov').style.zIndex = 70;
}
function cookIngr() {
  const r = R(cook.id);
  sheet(`<h3>Інгредієнти</h3><ul class="ing">${grouped(r.ingredients, i => i.group).map(b => (b.group ? `<li class="grp">${groupEmoji(b.group)} ${esc(b.group)}</li>` : '') + b.items.map(({ x: i }) => `<li><span class="q">${esc(i.amount != null ? fmtNum(i.amount * (cook.k || 1)) + ' ' + i.unit : i.unit)}</span><span>${esc(i.name)}</span></li>`).join('')).join('')}</ul>`);
  document.getElementById('ov').style.zIndex = 70;
}
function addTimer(sec, label) { unlockAudio(); hapticTick(); cook.timers.push({ id: uid(), end: Date.now() + sec * 1000, label, rung: 0 }); tickTimers(); toast(`⏱ Таймер ${label} запущено`); }
function tickTimers() {
  const box = document.getElementById('tlist'); if (!box) return;
  const now = Date.now();
  box.innerHTML = cook.timers.map(t => {
    const left = Math.max(0, Math.round((t.end - now) / 1000));
    if (!left && now - (t.rungAt || 0) > 4000 && t.rung < 15) { t.rung++; t.rungAt = now; ring(); }   // дзвонить кожні 4 с, доки не вимкнете
    const h = Math.floor(left / 3600), mm = String(Math.floor(left % 3600 / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
    return `<div class="timer ${left ? '' : 'ring'}" ${left ? '' : `onclick="cook.timers=cook.timers.filter(x=>x.id!=='${t.id}');tickTimers()"`}>⏱ ${left ? `${h ? h + ':' : ''}${mm}:${ss}` : 'Час! Торкніться'} <span class="small" style="opacity:.75">${esc(t.label)}</span>
      <button onclick="event.stopPropagation();cook.timers=cook.timers.filter(x=>x.id!=='${t.id}');tickTimers()" style="font-size:18px" aria-label="Прибрати таймер">×</button></div>`;
  }).join('');
}
// ---- Звук і вібрація таймера ----
// Вібрація: Android — navigator.vibrate; iPhone (iOS 18+) — «тік» системного перемикача <input switch>.
let hapticEl = null;
function hapticTick() {
  try {
    if (navigator.vibrate && navigator.vibrate(60)) return;
    if (!hapticEl) {
      const l = document.createElement('label'); l.setAttribute('aria-hidden', 'true');
      l.style.cssText = 'position:fixed;left:-100px;top:-100px;opacity:0;pointer-events:none';
      const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i);
      document.body.appendChild(l); hapticEl = l;
    }
    hapticEl.click();
  } catch {}
}
function vibratePattern() {
  if (navigator.vibrate && navigator.vibrate([500, 150, 500, 150, 800])) return;
  [0, 120, 240, 600, 720, 840, 1200, 1320, 1440].forEach(t => setTimeout(hapticTick, t));   // три серії «тіків»
}
// Звук: просимо iOS грати як медіаплеєр — тоді чути навіть у беззвучному режимі
function audioReady() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try { cook.ac = cook.ac || new (window.AudioContext || window.webkitAudioContext)(); if (cook.ac.state !== 'running') cook.ac.resume(); } catch {}
  return cook.ac;
}
function unlockAudio() {   // викликати з натискання користувача — інакше iPhone не дасть звук
  const ac = audioReady(); if (!ac) return;
  try { const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource(); src.buffer = b; src.connect(ac.destination); src.start(0); } catch {}
}
function beep() {
  const ac = audioReady(); if (!ac) return;
  try {
    const vol = S.settings.timerVolume ?? 0.8;
    [[0, 880], [0.18, 1320], [0.36, 880], [0.54, 1320], [0.9, 880], [1.08, 1320], [1.26, 880], [1.44, 1320]].forEach(([d, f]) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(vol * 0.35, ac.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d + 0.16);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.17);
    });
  } catch {}
}
function ring() { beep(); if (S.settings.timerVibrate !== false) vibratePattern(); }
function testAlarm() { unlockAudio(); ring(); toast('🔔 Так звучить таймер'); }
function endCook(done) {
  if (cook.timers.some(t => t.end > Date.now()) && !confirm('Є активні таймери. Вийти?')) return;
  clearInterval(cook.tick); cook.timers = []; try { cook.lock?.release(); } catch {} cook.lock = null;
  try { cook.vid?.pause(); } catch {}
  document.getElementById('cook')?.remove(); if (done) toast('Смачного! 🍽️');
}

/* ====================== Старт ====================== */
load(); takeSnap(); render(); checkHash();
try { navigator.storage?.persist?.(); } catch {}
if (!S.meta.syncOff) setTimeout(() => syncNow(), 800);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !S.meta.syncOff) syncNow(); });
window.addEventListener('hashchange', checkHash);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
